[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-hw1"
version = "1.0.0"
description = "Console coding agent with tool calling: policy, crash recovery, budgets, plan mode, tasks, change journal and rollback"
readme = "README.md"
requires-python = ">=3.10"
# Агент использует только стандартную библиотеку: HTTP-клиент к OpenAI-compatible API написан на urllib.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
coding-agent = "agent.cli:main"

[tool.setuptools]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
